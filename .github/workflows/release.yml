name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Note: the @changesets/cli dependency gets added when release tooling lands (milestone M6).
      # Until then this step is skipped so the pipeline stays green.
      # Git-tag based releases only — no npm publish.
      - uses: changesets/action@v2
        if: hashFiles('.changeset/config.json') != ''
        with:
          version: pnpm changeset version
          # Git-tag based releases only - no npm publish.
          publish: pnpm changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The action does not reliably push tags created by the publish script
      # under pnpm, so push them explicitly.
      - run: git push origin --tags
