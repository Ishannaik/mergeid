name: mergeid-prod

# Set DATABASE_URL yourself when POSTGRES_USER/POSTGRES_PASSWORD contain characters
# that are reserved in a URI (@ : / ? # %). The composed default below inserts them
# verbatim, which would not survive URL parsing.
x-database-url: &database-url
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-mergeid}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-mergeid}}

# Redis requires a password (see the redis service below), so the URL carries one.
# Same URI-encoding caveat as DATABASE_URL: set REDIS_URL yourself if the password
# contains @ : / ? # %.
x-redis-url: &redis-url
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379}

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mergeid}
      POSTGRES_USER: ${POSTGRES_USER:-mergeid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8.2.1-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # Password comes from the environment rather than an inline argument so it
    # does not show up in `ps` inside the container. The AOF file on the named
    # volume holds queue payloads, so an unauthenticated Redis would expose them
    # to anything else sharing a Docker network with this stack.
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrate
    environment: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    environment:
      <<: [*database-url, *redis-url]
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      DISCORD_DEV_GUILD_ID: ${DISCORD_DEV_GUILD_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID is required}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET is required}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:?OAUTH_REDIRECT_URI is required}
      GITHUB_BASE_SCOPES: ${GITHUB_BASE_SCOPES:-read:user,read:org}
      PORT: ${PORT:-3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MERGEID_ROLES: ${MERGEID_ROLES:-bot,api,worker}
    # GitHub redirects the user's browser to OAUTH_REDIRECT_URI, so the api role's
    # listener has to be reachable from outside this network. Published on all
    # interfaces by default; set HTTP_BIND_HOST=127.0.0.1 when a reverse proxy on
    # the same host terminates TLS and forwards to it.
    ports:
      - '${HTTP_BIND_HOST:-0.0.0.0}:${HTTP_PUBLISHED_PORT:-${PORT:-3000}}:${PORT:-3000}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
